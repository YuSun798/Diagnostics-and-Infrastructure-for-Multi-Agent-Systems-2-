<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1400 720" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id6" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6B9A" /></marker><marker id="id7" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#C77A2D" /></marker></defs><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="700" y="48">THE DIAGNOSTICS–INFRASTRUCTURE RETENTION TENSION</text><rect fill="#EAF2F8" height="500" rx="20" ry="20" stroke="#2F6B9A" stroke-width="3" width="270" x="55" y="100" /><rect fill="#FFF3E6" height="500" rx="20" ry="20" stroke="#C77A2D" stroke-width="3" width="270" x="1075" y="100" /><text fill="#2F6B9A" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="190" y="140">DIAGNOSTICS</text><text fill="#2F6B9A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="190" y="168">RETAIN</text><text fill="#C77A2D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="1210" y="140">INFRASTRUCTURE</text><text fill="#C77A2D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1210" y="168">DISCARD / RECLAIM</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#9FC0DA" stroke-width="1.6" width="216" x="82" y="220" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="190" y="253">Failure localization</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="190" y="279">full traces / history</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#9FC0DA" stroke-width="1.6" width="216" x="82" y="330" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="190" y="363">Observability</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="190" y="389">rich execution context</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#9FC0DA" stroke-width="1.6" width="216" x="82" y="440" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="190" y="473">Replay / repair</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="190" y="499">restorable state</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#E1B27A" stroke-width="1.6" width="216" x="1102" y="220" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1210" y="253">Memory management</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1210" y="279">evict low-reuse state</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#E1B27A" stroke-width="1.6" width="216" x="1102" y="330" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1210" y="363">Scheduling</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1210" y="389">bound latency / overhead</text><rect fill="#FFFFFF" height="82" rx="10" ry="10" stroke="#E1B27A" stroke-width="1.6" width="216" x="1102" y="440" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1210" y="473">Cache lifecycle</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1210" y="499">expire / recompute</text><rect fill="#FFFDF5" height="86" rx="14" ry="14" stroke="#AEB4B8" stroke-width="2.5" width="620" x="390" y="100" /><text fill="#111111" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="700" y="134">SHARED RUNTIME STATE</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="700" y="164">retention budget: memory | trace fidelity | replayability</text><line marker-end="url(#id6)" stroke="#2F6B9A" stroke-width="3" x1="325" x2="388" y1="143" y2="143" /><line marker-end="url(#id7)" stroke="#C77A2D" stroke-width="3" x1="1074" x2="1012" y1="143" y2="143" /><rect fill="#FCECEC" height="76" rx="10" ry="10" stroke="#B84A4A" stroke-width="2" width="620" x="390" y="210" /><text fill="#B84A4A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="420" y="240">Cross-layer conflict 1: eviction</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="420" y="265">Serving evicts inactive state; post-hoc diagnosis values that history.</text><rect fill="#FCECEC" height="76" rx="10" ry="10" stroke="#B84A4A" stroke-width="2" width="620" x="390" y="305" /><text fill="#B84A4A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="420" y="335">Cross-layer conflict 2: snapshots</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="420" y="360">Replay methods need restorable environment state not retained by default.</text><rect fill="#F1ECF8" height="76" rx="10" ry="10" stroke="#7A5FA3" stroke-width="2" width="620" x="390" y="400" /><text fill="#7A5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="420" y="430">Intra-layer analogue: compression</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="420" y="455">TrajAudit trades retained context for lower diagnostic cost.</text><rect fill="#F3F5F6" height="76" rx="10" ry="10" stroke="#7B8790" stroke-width="2" width="620" x="390" y="495" /><text fill="#7B8790" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="420" y="525">Boundary condition: replay cost</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="420" y="550">Replay becomes a serving conflict when diagnosis moves online.</text><rect fill="#EAF6EF" height="50" rx="12" ry="12" stroke="#3F8A64" stroke-width="2" width="1160" x="120" y="630" /><text fill="#3F8A64" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="700" y="661">Empirical anchor (TraceElephant): full traces raise step-level attribution from 16% to 28.1% (+76% relative).</text></svg>