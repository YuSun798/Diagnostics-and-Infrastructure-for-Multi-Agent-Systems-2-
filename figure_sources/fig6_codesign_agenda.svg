<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1400 640" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id8" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#B84A4A" /></marker><marker id="id9" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#B84A4A" /></marker><marker id="id10" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6B9A" /></marker><marker id="id11" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#2F6B9A" /></marker><marker id="id12" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#3F8A64" /></marker><marker id="id13" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#3F8A64" /></marker><marker id="id14" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#7A5FA3" /></marker><marker id="id15" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M 0 0 L 8 4 L 0 8 z" fill="#7A5FA3" /></marker></defs><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="700" y="48">CO-DESIGN RESEARCH AGENDA</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="700" y="78">Four ways to make the retention budget an explicit cross-layer resource</text><rect fill="#FCECEC" height="200" rx="18" ry="18" stroke="#B84A4A" stroke-width="3" width="630" x="55" y="110" /><text fill="#B84A4A" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="79" y="148">1. Retention-aware eviction</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="83" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="163" y="217">suspect state</text><line marker-end="url(#id8)" stroke="#B84A4A" stroke-width="2.5" x1="243" x2="268" y1="211" y2="211" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="273" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="353" y="217">pin / protect</text><line marker-end="url(#id9)" stroke="#B84A4A" stroke-width="2.5" x1="433" x2="458" y1="211" y2="211" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="463" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="543" y="217">preserve evidence</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="370" y="275">Trade bounded memory for replayable diagnostic evidence.</text><rect fill="#EAF2F8" height="200" rx="18" ry="18" stroke="#2F6B9A" stroke-width="3" width="630" x="715" y="110" /><text fill="#2F6B9A" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="739" y="148">2. Failure-aware scheduling</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="743" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="823" y="217">attribution signal</text><line marker-end="url(#id10)" stroke="#2F6B9A" stroke-width="2.5" x1="903" x2="928" y1="211" y2="211" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="933" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1013" y="217">scheduler</text><line marker-end="url(#id11)" stroke="#2F6B9A" stroke-width="2.5" x1="1093" x2="1118" y1="211" y2="211" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="1123" y="185" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1203" y="217">deprioritize risk</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1030" y="275">Feed reliability evidence back into placement and execution policy.</text><rect fill="#EAF6EF" height="200" rx="18" ry="18" stroke="#3F8A64" stroke-width="3" width="630" x="55" y="350" /><text fill="#3F8A64" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="79" y="388">3. Budgeted observability</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="83" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="163" y="457">SLO / budget</text><line marker-end="url(#id12)" stroke="#3F8A64" stroke-width="2.5" x1="243" x2="268" y1="451" y2="451" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="273" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="353" y="457">trace fidelity</text><line marker-end="url(#id13)" stroke="#3F8A64" stroke-width="2.5" x1="433" x2="458" y1="451" y2="451" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="463" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="543" y="457">dynamic capture</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="370" y="515">Negotiate diagnostic fidelity against serving cost at runtime.</text><rect fill="#F1ECF8" height="200" rx="18" ry="18" stroke="#7A5FA3" stroke-width="3" width="630" x="715" y="350" /><text fill="#7A5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="739" y="388">4. Infrastructure-triggered diagnostics</text><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="743" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="823" y="457">latency / memory</text><line marker-end="url(#id14)" stroke="#7A5FA3" stroke-width="2.5" x1="903" x2="928" y1="451" y2="451" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="933" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1013" y="457">early warning</text><line marker-end="url(#id15)" stroke="#7A5FA3" stroke-width="2.5" x1="1093" x2="1118" y1="451" y2="451" /><rect fill="#FFFFFF" height="52" rx="9" ry="9" stroke="#D4DADF" stroke-width="1.6" width="160" x="1123" y="425" /><text fill="#203040" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1203" y="457">start diagnosis</text><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="1030" y="515">Use serving anomalies as triggers before task-level failure surfaces.</text><rect fill="#F5F7F9" height="38" rx="9" ry="9" stroke="#D7DEE5" stroke-width="1.6" width="1040" x="180" y="585" /><text fill="#66727D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="700" y="610">All four are research proposals grounded in surveyed components; none is claimed as an implemented system.</text></svg>