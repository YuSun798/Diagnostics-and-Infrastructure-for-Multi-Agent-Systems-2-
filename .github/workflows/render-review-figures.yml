name: Render review figures

on:
  push:
    paths:
      - 'tools/render_review_figures.py'
      - '.github/workflows/render-review-figures.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install svgwrite cairosvg

      - name: Render SVG and PDF figures
        run: python tools/render_review_figures.py

      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figure_sources/*.svg fig1_overview.pdf fig2_diagnostics_taxonomy.pdf fig3_diagnostic_pipeline.pdf fig4_infrastructure.pdf fig5_tension.pdf fig6_codesign_agenda.pdf
          if git diff --cached --quiet; then
            echo "No rendered figure changes"
          else
            git commit -m "Render review figures as PDF [skip ci]"
            git push
          fi
